<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Ma Gestion Web</title>
<style>
  :root {
    --couleur: #1f4e79;
    --couleur-fonce: #163a5b;
    --fond: #f5f7fa;
    --texte: #1d2733;
    --blanc: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    font-family: system-ui, Arial, sans-serif;
    color: var(--texte); background: var(--fond);
  }
  :focus-visible { outline: 3px solid var(--couleur); outline-offset: 2px; }
  .carte {
    width: 100%; max-width: 400px; text-align: center;
    background: var(--blanc); border: 2px solid var(--couleur);
    border-radius: 12px; padding: 28px 22px;
  }
  .logo { width: min(180px, 60%); height: auto; }
  h1 { color: var(--couleur); font-size: 1.4rem; margin: 14px 0 18px; }
  label { display: block; text-align: left; margin: 12px 0 4px; font-weight: 600; }
  input {
    width: 100%; padding: 12px; font-size: 1rem;
    border: 2px solid #8a96a3; border-radius: 8px;
  }
  button {
    width: 100%; margin-top: 22px; padding: 14px;
    background: var(--couleur); color: var(--blanc);
    font: 600 1.1rem system-ui, Arial, sans-serif;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: var(--couleur-fonce); }
  .erreur { color: #b3262e; min-height: 1.4em; margin: 10px 0 0; }
  .retour { display: inline-block; margin-top: 16px; color: var(--couleur); }
</style>
</head>
<body>

<main class="carte">
  <img class="logo" src="https://raw.githubusercontent.com/cftcmafsas-ai/Guerisseur-de-lame/main/logos.JPG" alt="Logo Ma Gestion Web">
  <h1>Connexion à ma gestion web</h1>

  <form id="formulaire" novalidate>
    <label for="identifiant">Identifiant</label>
    <input id="identifiant" type="text" autocomplete="username">

    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password">

    <p class="erreur" id="erreur" role="alert"></p>
    <button type="submit">Se connecter</button>
  </form>

  <a class="retour" href="index.html">Retour à l'accueil</a>
</main>

<script>
  // Lien de l'application Wix
  var LIEN_WIX = "gestion.html";

  // Reprendre la couleur choisie sur la page d'accueil
  try {
    var c = localStorage.getItem("mgw-couleur");
    if (c) {
      var n = parseInt(c.slice(1), 16);
      var r = Math.round(((n >> 16) & 255) * 0.75);
      var g = Math.round(((n >> 8) & 255) * 0.75);
      var b = Math.round((n & 255) * 0.75);
      var f = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      document.documentElement.style.setProperty("--couleur", c);
      document.documentElement.style.setProperty("--couleur-fonce", f);
    }
  } catch (e) {}

  document.getElementById("formulaire").addEventListener("submit", function (e) {
    e.preventDefault();
    var id = document.getElementById("identifiant").value.trim();
    var mdp = document.getElementById("mdp").value;
    var erreur = document.getElementById("erreur");
    if (!id || !mdp) {
      erreur.textContent = "Saisissez votre identifiant et votre mot de passe.";
      return;
    }
    window.location.href = LIEN_WIX;
  });
</script>
</body>
</html>
